<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f3ec">
<title>мягко. — тестовый магазин</title>
<style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f6f3ec;color:#223e34;font:17px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:420px;padding:32px}h1{font-size:64px;letter-spacing:-4px;margin:0}p{color:#73766b}button{padding:14px 22px;border:0;border-radius:30px;background:#223e34;color:#fff;font:inherit;cursor:pointer}</style>
</head>
<body>
<main><h1>мягко.</h1><p id="status" role="status">Открываем магазин…</p><button id="retry" hidden onclick="location.reload()">Попробовать ещё раз</button><noscript>Для каталога и анимаций нужен JavaScript.</noscript></main>
<script>
(async function () {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 25000);
  try {
    if (typeof DecompressionStream === 'undefined') throw new Error('Откройте ссылку в обновлённом Safari или Chrome.');
    const chunks = await Promise.all(Array.from({length:6}, async (_, i) => {
      const response = await fetch('part' + i + '.txt', {signal:controller.signal});
      if (!response.ok) throw new Error('Не удалось загрузить часть магазина.');
      return response.text();
    }));
    const packed = Uint8Array.from(atob(chunks.join('').replace(/\s/g, '')), c => c.charCodeAt(0));
    const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream('deflate'));
    const bytes = await new Response(stream).arrayBuffer();
    const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)), b => b.toString(16).padStart(2, '0')).join('');
    if (hash !== '94b36968efdaf4a53bef092d40ecae90febb6251838a6ed89d930b0e9b0a70dc') throw new Error('Файлы загрузились не полностью. Повторите открытие.');
    clearTimeout(timer);
    const html = new TextDecoder().decode(bytes);
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    clearTimeout(timer);
    document.getElementById('status').textContent = error.name === 'AbortError' ? 'Загрузка прервалась. Проверьте интернет и повторите.' : (error.message || 'Не удалось открыть магазин.');
    document.getElementById('retry').hidden = false;
  }
})();
</script>
</body>
</html>
