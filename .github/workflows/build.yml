# Проверка основной ветки русского форка.
#
# Исходный workflow после тестов авторизовался в GCP-проекте автора и
# публиковал server/agent-computer образы в его Artifact Registry. Здесь
# сохранены строгие проверки и Docker-сборки, но внешняя публикация полностью
# удалена. Образы собираются только внутри временного GitHub runner.

name: Сборка и проверка

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Определить изменённые части
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            agent:
              - 'server/src/agents/**'
              - 'server/src/scripts/build-agent-bundle.mjs'
              - 'server/docker/agent-computer.Dockerfile'
              - 'server/docker/agent-computer.Dockerfile.dockerignore'
              - 'server/docker/agent-computer-cumora.sh'
              - 'server/docker/agent-computer-entrypoint.sh'
              - 'agent-cli/**'
              - 'agent-fuse/**'
              - '.github/workflows/build.yml'
              - 'package.json'
              - 'package-lock.json'

  typecheck:
    name: TypeScript — клиент и сервер
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Проверить клиент
        run: npm run typecheck
      - name: Проверить сервер
        run: npm run server:typecheck

  quality:
    name: Линтер, guards, unit и integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cumora
          POSTGRES_PASSWORD: cumora
          POSTGRES_DB: cumora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cumora -d cumora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: ''
      EMAIL_DOMAIN: cumora.local
      EMAIL_INBOUND_HMAC_SECRET: ci-test-secret
      AUTH_SECRET: ci-test-auth-secret
      OPENAI_API_KEY: ci-test-openai-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Установить зависимости Email Worker
        run: npm ci --prefix workers/email-gate
      - name: Biome
        run: npm run lint
      - name: Статические защитные проверки
        run: npm run guard:big-brain && npm run guard:llm-tracked && npm run guard:engine-registry
      - name: Модульные тесты
        run: npm test --silent
      - name: Включить pgvector
        run: PGPASSWORD=cumora psql -h localhost -U cumora -d cumora_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Интеграционные тесты
        run: npm run test:integration

  web-build:
    name: Production-сборка интерфейса
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [typecheck, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Собрать интерфейс без upstream API
        env:
          VITE_CUMORA_API_BASE: ''
        run: npm run build
      - name: Сохранить dist для проверки
        uses: actions/upload-artifact@v4
        with:
          name: cumora-ru-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  server-image:
    name: Собрать Docker-образ сервера без публикации
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Локальная buildx-сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/cumora-server.Dockerfile
          platforms: linux/amd64
          push: false
          tags: cumora-ru/server:${{ github.sha }}
          cache-from: type=gha,scope=server-ru
          cache-to: type=gha,scope=server-ru,mode=max,ignore-error=true

  agent-cli:
    name: Собрать BYOA CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, typecheck, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Собрать standalone CLI
        run: node agent-cli/build.mjs
      - name: Проверить русскую справку и отсутствие upstream fallback
        shell: bash
        run: |
          set -euo pipefail
          node agent-cli/dist/cli.js > /tmp/cumora-help.txt 2>&1 || true
          grep -q 'запуск агентов Cumora' /tmp/cumora-help.txt
          if grep -q 'https://api.cumora.ai' agent-cli/dist/cli.js; then
            echo 'В собранной CLI найден upstream API fallback.' >&2
            exit 1
          fi
      - name: Сохранить CLI как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: cumora-ru-agent-cli-${{ github.sha }}
          path: agent-cli/dist/
          if-no-files-found: error
          retention-days: 7

  agent-image:
    name: Собрать Docker-образ agent-computer без публикации
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, typecheck, quality, agent-cli]
    if: needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Подготовить bundle агента
        run: node server/src/scripts/build-agent-bundle.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Локальная buildx-сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/agent-computer.Dockerfile
          platforms: linux/amd64
          push: false
          tags: cumora-ru/agent-computer:${{ github.sha }}
          cache-from: type=gha,scope=agent-ru
          cache-to: type=gha,scope=agent-ru,mode=max,ignore-error=true
