name: Сборка и проверка

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_images:
        description: 'Дополнительно собрать локальные Docker-образы сервера и agent-computer'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript — клиент и сервер
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Проверить клиент
        run: npm run typecheck
      - name: Проверить сервер
        run: npm run server:typecheck

  quality:
    name: Guards, линтер, unit и integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cumora
          POSTGRES_PASSWORD: cumora
          POSTGRES_DB: cumora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cumora -d cumora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: ''
      EMAIL_DOMAIN: cumora.local
      EMAIL_INBOUND_HMAC_SECRET: ci-test-secret
      AUTH_SECRET: ci-test-auth-secret
      OPENAI_API_KEY: ci-test-openai-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Установить зависимости Email Worker
        run: npm ci --prefix workers/email-gate
      - name: Проверить независимость форка
        run: node scripts/guard-fork-boundaries.mjs
      - name: Статические проверки моделей и движков
        run: npm run guard:big-brain && npm run guard:llm-tracked && npm run guard:engine-registry
      - name: Biome
        run: npm run lint
      - name: Модульные тесты
        run: npm test --silent
      - name: Включить pgvector
        run: PGPASSWORD=cumora psql -h localhost -U cumora -d cumora_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Интеграционные тесты
        run: npm run test:integration

  web-build:
    name: Production-сборка интерфейса
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [typecheck, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Собрать интерфейс без upstream API
        env:
          VITE_CUMORA_API_BASE: ''
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cumora-ru-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  agent-cli:
    name: Собрать BYOA CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Собрать standalone CLI
        run: node agent-cli/build.mjs
      - name: Проверить русскую справку и безопасную точку входа
        shell: bash
        run: |
          set -euo pipefail
          node agent-cli/dist/cli.js > /tmp/cumora-help.txt 2>&1 || true
          grep -q 'запуск агентов Cumora' /tmp/cumora-help.txt
          grep -q "CUMORA_SERVER_URL = 'http://localhost:5181'" agent-cli/src/cli.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cumora-ru-agent-cli-${{ github.sha }}
          path: agent-cli/dist/
          if-no-files-found: error
          retention-days: 7

  server-image:
    name: Docker-образ сервера без публикации
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/cumora-server.Dockerfile
          platforms: linux/amd64
          push: false
          tags: cumora-ru/server:${{ github.sha }}
          cache-from: type=gha,scope=server-ru
          cache-to: type=gha,scope=server-ru,mode=max,ignore-error=true

  agent-image:
    name: Docker-образ agent-computer без публикации
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [typecheck, quality, agent-cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Подготовить bundle агента
        run: node server/src/scripts/build-agent-bundle.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/agent-computer.Dockerfile
          platforms: linux/amd64
          push: false
          tags: cumora-ru/agent-computer:${{ github.sha }}
          cache-from: type=gha,scope=agent-ru
          cache-to: type=gha,scope=agent-ru,mode=max,ignore-error=true
