# Исходный workflow отправлял repository_dispatch в закрытый репозиторий
# сборок автора. Русский форк не должен использовать его токены, runners или
# каналы подписи.
#
# Эта безопасная заглушка проверяет только формат версии и показывает план.
# Для настоящего релиза нужен отдельный workflow, который собирает приложения
# в Merkos-free/cumora, подписывает их вашими сертификатами и публикует assets в
# GitHub Release именно этого репозитория.

name: Подготовка релиза русского форка

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса v, например 0.11.0-ru.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-checklist:
    name: Проверить версию и показать план
    runs-on: ubuntu-latest
    steps:
      - name: Проверить формат версии
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Ожидается semver без префикса v, например 0.11.0-ru.1.' >&2
            exit 1
          fi

      - name: Показать безопасный план выпуска
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Релиз v$VERSION не публиковался

          Связь с закрытым репозиторием сборок автора удалена. Перед первым
          настоящим выпуском русского форка нужно настроить:

          1. macOS-сборку и собственные сертификаты подписи/notarization;
          2. Windows-сборку и подпись установщика;
          3. Linux AppImage/deb;
          4. публикацию assets в GitHub Release репозитория
             \`Merkos-free/cumora\`;
          5. проверку автообновления только через релизы этого форка;
          6. smoke-тест установленной сборки на каждой платформе.
          EOF
