name: Завершение русской Windows/BYOA-редакции

on:
  push:
    branches: [localization/ru-conversational]
    paths:
      - "scripts/finalize-russian-fork.py"
      - ".github/workflows/finalize-russian-fork.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-russian-fork
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization/ru-conversational
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Применить воспроизводимые изменения
        run: |
          python -m py_compile scripts/finalize-russian-fork.py
          python scripts/finalize-russian-fork.py
          git diff --check

      - name: Проверить код перед коммитом
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run server:typecheck
          npm test

      - name: Зафиксировать результат в рабочей ветке
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Изменений нет: редакция уже собрана."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: завершить русскую Windows/BYOA-редакцию"
          git push origin HEAD:localization/ru-conversational
