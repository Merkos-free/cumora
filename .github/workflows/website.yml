# Исходный workflow публиковал сайт в Cloudflare Pages-проект автора
# `cumora` и использовал его account ID. Русский форк не должен обращаться к
# чужому Cloudflare-аккаунту. Пока собственный домен/Pages-проект не настроен,
# workflow только упаковывает статический сайт в проверяемый артефакт.

name: Собрать русский сайт

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Проверить и упаковать website/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Проверить обязательные файлы
        shell: bash
        run: |
          set -euo pipefail
          test -f website/index.html
          test -f website/privacy.html
          test -d website/assets
          grep -q '<html lang="ru">' website/index.html
          grep -q 'Merkos-free/cumora' website/index.html
          if grep -R --line-number --fixed-strings 'api.cumora.ai' website; then
            echo 'На сайте русского форка найдена runtime-ссылка на upstream API.' >&2
            exit 1
          fi

      - name: Упаковать статический сайт
        uses: actions/upload-artifact@v4
        with:
          name: cumora-ru-website-${{ github.sha }}
          path: website/
          if-no-files-found: error
          retention-days: 14

      - name: Итог
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Сайт собран как артефакт

          Ничего не публиковалось во внешний аккаунт. После выбора собственного
          домена можно заменить этот job на GitHub Pages или Cloudflare Pages,
          используя только ресурсы и секреты владельца `Merkos-free`.
          EOF
