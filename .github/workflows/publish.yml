# Исходный workflow автоматически публиковал пакет с именем `cumora` в npm.
# Это имя и канал релизов принадлежат оригинальному проекту. Русский форк не
# должен пытаться занять, перезаписать или случайно выпустить чужой пакет.
#
# Перед публикацией собственной CLI нужно:
#   1. выбрать доступное имя или npm-scope, принадлежащий Merkos-free;
#   2. изменить agent-cli/package.json и команды установки в интерфейсе;
#   3. проверить сборку пакета и запуск на macOS, Windows/WSL2 и Linux;
#   4. создать отдельный automation token только для выбранного пакета;
#   5. заменить эту заглушку после code review.

name: Публикация CLI отключена — выберите своё npm-имя

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Введите ПОНИМАЮ, чтобы увидеть инструкцию. Публикации не будет.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  safety-notice:
    name: Безопасная заглушка npm
    runs-on: ubuntu-latest
    steps:
      - name: Проверить подтверждение
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != 'ПОНИМАЮ' ]; then
            echo 'Подтверждение не совпало. Никаких действий не выполнено.' >&2
            exit 1
          fi

      - name: Показать план выпуска
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## npm-публикация не выполнялась

          Пакет `agent-cli` помечен как `private`, а этот workflow ничего не
          публикует. Сначала зарегистрируйте собственное имя, например пакет в
          вашем npm-scope, затем одновременно обновите:

          - `agent-cli/package.json`;
          - команды подключения компьютера в интерфейсе и документации;
          - workflow публикации;
          - механизм автообновления BYOA-службы;
          - тесты установки на поддерживаемых системах.

          До этого русскую CLI безопаснее запускать из клона репозитория.
          EOF
