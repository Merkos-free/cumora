name: Myagko Bunny 3D Export

on:
  push:
    branches: [myagko-3d-lab]
    paths:
      - '.github/workflows/myagko-bunny-export.yml'
      - 'experiments/myagko-3d/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-bunny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch selected free Blendkit asset
        run: |
          python3 experiments/myagko-3d/scripts/fetch_blendkit_bunny.py

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libxkbcommon0 libsm6 libice6 libwayland-client0 libwayland-egl1

      - name: Download Blender 4.5 LTS
        run: |
          curl --fail --location --retry 3 --output /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | head -n 2

      - name: Export browser GLB and studio preview
        env:
          EGL_PLATFORM: surfaceless
        run: |
          mkdir -p experiments/myagko-3d/out
          /tmp/blender/blender --background \
            --python experiments/myagko-3d/scripts/export_bunny_glb.py -- \
            --input experiments/myagko-3d/source/bunny.blend \
            --output experiments/myagko-3d/out/bunny-soft-toy.glb \
            --preview experiments/myagko-3d/out/bunny-preview.png \
            --summary experiments/myagko-3d/out/bunny-summary.json

      - name: Verify outputs
        run: |
          ls -lh experiments/myagko-3d/out
          test -s experiments/myagko-3d/out/bunny-soft-toy.glb
          test -s experiments/myagko-3d/out/bunny-preview.png
          cat experiments/myagko-3d/out/bunny-summary.json

      - name: Publish generated web assets to preview branch
        run: |
          mkdir -p experiments/myagko-3d/site
          cp experiments/myagko-3d/out/bunny-soft-toy.glb experiments/myagko-3d/site/bunny-soft-toy.glb
          cp experiments/myagko-3d/out/bunny-preview.png experiments/myagko-3d/site/bunny-preview.png
          cp experiments/myagko-3d/out/bunny-summary.json experiments/myagko-3d/site/bunny-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/myagko-3d/site/bunny-soft-toy.glb experiments/myagko-3d/site/bunny-preview.png experiments/myagko-3d/site/bunny-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "build(myagko): publish generated bunny 3d assets"
            git push origin HEAD:myagko-3d-lab
          fi

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: myagko-bunny-3d
          path: |
            experiments/myagko-3d/out/bunny-soft-toy.glb
            experiments/myagko-3d/out/bunny-preview.png
            experiments/myagko-3d/out/bunny-summary.json
            experiments/myagko-3d/source/bunny.json
          if-no-files-found: error
          retention-days: 3
