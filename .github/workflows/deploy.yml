# ВАЖНО: исходный workflow управлял конкретным GKE-кластером автора проекта,
# Artifact Registry `cumora` и production API api.cumora.ai. Эти координаты не
# принадлежат русскому форку и не должны использоваться даже случайно.
#
# Файл сохранён как заметная безопасная заглушка. Перед собственным deploy:
#   1. создайте отдельный workflow под выбранный VPS/Kubernetes/облако;
#   2. используйте только свои registry, cluster, project и домены;
#   3. защитите environment ручным approval;
#   4. добавьте rollback и smoke-проверку своего API;
#   5. удалите эту заглушку лишь после code review.

name: Развёртывание отключено — сначала настройте свою инфраструктуру

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Введите ПОНИМАЮ, чтобы открыть инструкцию. Production не изменится.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  safety-notice:
    name: Безопасная заглушка
    runs-on: ubuntu-latest
    steps:
      - name: Проверить подтверждение
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != 'ПОНИМАЮ' ]; then
            echo 'Подтверждение не совпало. Никаких действий не выполнено.' >&2
            exit 1
          fi

      - name: Показать следующий шаг
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Развёртывание не выполнялось

          Workflow исходного проекта был намеренно обезврежен: он содержал
          жёсткие ссылки на чужой GCP-проект, Artifact Registry, GKE-кластер и
          `https://api.cumora.ai`.

          Создайте отдельный deploy-workflow для своей инфраструктуры и только
          после проверки замените эту заглушку. Рекомендуемый минимальный контур:

          1. сборка образа из SHA коммита;
          2. публикация в собственный registry;
          3. миграция базы отдельным шагом;
          4. развёртывание с защищённым GitHub Environment;
          5. smoke-тест собственного HTTPS API;
          6. автоматический rollback при ошибке.
          EOF
